<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone | RocketEarn X</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #05030a; color: #fff; font-family: 'Outfit', sans-serif; }
        .glass-card { background: rgba(20, 10, 30, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(0, 240, 255, 0.2); }
        .modal-overlay { display: none; background: rgba(0,0,0,0.9); position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-overlay.active { display: flex; }
    </style>
</head>
<body class="bg-[radial-gradient(circle_at_center,_rgba(0,240,255,0.1)_0%,_#05030a_100%)] h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="glass-card p-4 flex justify-between items-center sticky top-0 z-50">
        <a href="index.html" class="text-xl font-bold text-white"><i class="fa-solid fa-arrow-left mr-2"></i> Back Home</a>
        <div class="font-bold text-gold-400">Wallet: ₹<span id="g-wallet">0</span></div>
    </nav>

    <!-- Main Game Area -->
    <div class="flex-1 p-6 overflow-y-auto">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">Rocket Game Zone</h1>
            <p class="text-gray-400">Play games uploaded by Admin and win real cash!</p>
        </div>

        <div id="games-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 max-w-7xl mx-auto">
            <div class="col-span-full text-center py-20 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-4xl mb-4"></i><p>Loading Games from Admin Server...</p></div>
        </div>
    </div>

    <!-- Play Modal -->
    <div id="playModal" class="modal-overlay px-4">
        <div class="glass-card w-full max-w-4xl h-[85vh] rounded-3xl flex flex-col relative overflow-hidden">
            <div class="p-4 border-b border-white/10 flex justify-between items-center bg-black/50 shrink-0">
                <h3 class="font-bold text-xl text-cyan-400" id="m-game-title">Game Title</h3>
                <button onclick="closePlayModal()" class="text-gray-400 hover:text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="m-setup" class="flex-1 flex flex-col items-center justify-center text-center p-6">
                <i class="fa-solid fa-gamepad text-6xl text-cyan-400 mb-4"></i>
                <h2 class="text-2xl font-bold mb-2">Ready to Play?</h2>
                <p class="text-gray-400 mb-6">Entry Fee is <span class="text-gold-400 font-bold" id="m-fee">₹0</span></p>
                <button onclick="deductAndPlay()" id="btn-play" class="bg-gradient-to-r from-cyan-500 to-blue-500 text-dark font-extrabold px-10 py-4 rounded-full text-lg shadow-[0_0_20px_#00f0ff] hover:scale-105 transition">Pay & Start</button>
            </div>

            <div id="m-play" class="flex-1 hidden bg-white">
                <iframe id="game-iframe" class="w-full h-full border-0"></iframe>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyAOIMAgYyPo2_SDamITiwUX-Q9fTPj-2HA", authDomain: "rocketearnx-bf10e.firebaseapp.com", databaseURL: "https://rocketearnx-bf10e-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "rocketearnx-bf10e", storageBucket: "rocketearnx-bf10e.firebasestorage.app", messagingSenderId: "282888117913", appId: "1:282888117913:web:86f236892842abcf9e6208"
        });
        const auth = getAuth(app); const db = getFirestore(app);
        
        let userWallet = 0; let cGameFee = 0; let cGameHtml = ""; let uid = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                uid = user.uid;
                onSnapshot(doc(db, "users", uid), d => { if(d.exists()) { userWallet = d.data().walletBalance || 0; document.getElementById('g-wallet').innerText = userWallet; } });
            } else { alert("Login required to play games!"); window.location.href = "index.html"; }
        });

        // Load Games from Admin Collection
        onSnapshot(collection(db, "games"), snap => {
            const cont = document.getElementById('games-container');
            if(snap.empty) {
                cont.innerHTML = `<div class="col-span-full text-center py-20"><i class="fa-solid fa-ghost text-6xl text-gray-600 mb-4"></i><h2 class="text-2xl font-bold text-gray-400">No Games Found</h2><p class="text-gray-500">Admin hasn't uploaded any games yet.</p></div>`;
                return;
            }
            let html = "";
            snap.forEach(d => {
                const g = d.data();
                // Store HTML in a global window object to use when clicked
                window[`game_html_${d.id}`] = g.gameHtml;
                html += `
                <div class="glass-card rounded-2xl p-6 text-center hover:-translate-y-2 transition cursor-pointer border-cyan-500/30">
                    <div class="w-16 h-16 mx-auto rounded-full bg-cyan-500/20 flex items-center justify-center text-3xl mb-4 border border-cyan-500"><i class="fa-solid fa-play text-cyan-400"></i></div>
                    <h3 class="font-bold text-xl mb-1">${g.name || 'Admin Game'}</h3>
                    <div class="bg-black/50 p-2 rounded-lg mt-3"><span class="text-[10px] text-gray-400 block uppercase">Entry Fee</span><span class="font-bold text-gold-400">₹${g.fee || 10}</span></div>
                    <button onclick="initGame('${g.name}', ${g.fee || 10}, '${d.id}')" class="mt-4 w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 rounded-lg">Play</button>
                </div>`;
            });
            cont.innerHTML = html;
        });

        window.initGame = (name, fee, id) => {
            cGameFee = fee; cGameHtml = window[`game_html_${id}`] || "<h2>Game Code Missing</h2>";
            document.getElementById('m-game-title').innerText = name; document.getElementById('m-fee').innerText = "₹" + fee;
            document.getElementById('m-setup').classList.remove('hidden'); document.getElementById('m-play').classList.add('hidden');
            document.getElementById('playModal').classList.add('active');
        };

        window.closePlayModal = () => { document.getElementById('playModal').classList.remove('active'); document.getElementById('game-iframe').removeAttribute('srcdoc'); };

        window.deductAndPlay = async () => {
            const btn = document.getElementById('btn-play');
            if(userWallet < cGameFee) return alert("Insufficient Wallet Balance!");
            btn.innerText = "Processing..."; btn.disabled = true;
            try {
                await updateDoc(doc(db, "users", uid), { walletBalance: userWallet - cGameFee });
                document.getElementById('m-setup').classList.add('hidden');
                document.getElementById('m-play').classList.remove('hidden');
                document.getElementById('game-iframe').srcdoc = cGameHtml;
            } catch(e) { alert("Error: " + e.message); }
            btn.innerText = "Pay & Start"; btn.disabled = false;
        };
    </script>
</body>
</html>
